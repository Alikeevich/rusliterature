<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Адал азамат. Герои книг</title>
  <meta name="description" content="Поговори с героями книг из программы по русской литературе для 6-9 классов. Проект «Адал азамат»." />
  <meta name="theme-color" content="#00a3c4" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2300a3c4'/><text x='50' y='70' font-size='60' text-anchor='middle' fill='%23f2b705' font-family='Georgia,serif' font-weight='700'>А</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="hero">
    <div class="ornament" aria-hidden="true"></div>
    <div class="hero-inner">
      <p class="hero-kicker">Русская литература · Русский язык</p>
      <h1>Адал азамат</h1>
      <p class="hero-sub">Выбери класс и героя книги. Спроси его о том, что тебе непонятно: почему он так поступил, что чувствовал, о чём думал.</p>
    </div>
    <div class="ornament ornament-bottom" aria-hidden="true"></div>
  </header>

  <nav class="grade-bar" aria-label="Классы">
    <div class="grade-tabs" role="tablist" id="tabs"></div>
  </nav>

  <main class="container" id="wall" role="tabpanel" aria-live="polite"></main>

  <footer class="footer">
    <div class="ornament ornament-thin" aria-hidden="true"></div>
    <p>Проект «Адал азамат» · уроки русской литературы и русского языка</p>
  </footer>

  <!-- Чат на весь экран -->
  <section class="chat" id="chat" role="dialog" aria-modal="true" aria-labelledby="chatName" hidden>
    <header class="chat-bar">
      <button class="bar-btn" id="chatClose" type="button" aria-label="Назад к героям">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="chat-who">
        <div class="photo photo-sm" id="chatAvatar"></div>
        <div class="chat-who-text">
          <h2 id="chatName"></h2>
          <p id="chatWork"></p>
        </div>
      </div>
      <button class="bar-btn" id="chatClear" type="button" aria-label="Начать разговор заново" title="Начать заново">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <div class="chat-scroll" id="chatScroll">
      <div class="chat-column">
        <div class="chat-intro">
          <div class="photo photo-lg" id="chatPortrait"></div>
          <h3 id="chatIntroName"></h3>
          <p id="chatIntroWork"></p>
        </div>
        <div class="chat-log" id="chatLog"></div>
      </div>
    </div>

    <div class="chat-bottom">
      <div class="chat-column">
        <div class="chat-suggestions" id="chatSuggestions"></div>
        <form class="chat-form" id="chatForm" autocomplete="off">
          <textarea id="chatInput" rows="1" maxlength="1000" placeholder="Напиши свой вопрос" aria-label="Ваш вопрос"></textarea>
          <button type="submit" class="send-btn" id="chatSend" aria-label="Отправить">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </form>
      </div>
    </div>
  </section>

  <script type="module" src="/app.js"></script>
</body>
</html>
